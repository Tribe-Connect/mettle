name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Type check
        run: npx tsc --noEmit
      - name: Engine tests
        working-directory: packages/engine
        run: node --experimental-strip-types --no-warnings --test test/*.test.ts
      - name: Adaptive engine simulation
        working-directory: packages/engine
        run: node --experimental-strip-types --no-warnings sim/harness.ts
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mettle-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
