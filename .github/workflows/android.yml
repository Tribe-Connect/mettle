name: Android APK

# Rev 3 — 14 Sep 2026
#
# Rev 2 built successfully, and the artifact was still not usable. `assembleDebug`
# produces an APK with NO JavaScript inside it: a debug build expects to fetch the
# bundle from a Metro dev server on a laptop over the local network. Installed on
# a phone with nothing serving it, it opens to "Unable to load script". The build
# was green and the deliverable was inert — which is a reminder that "CI passed"
# and "the thing works" are different claims.
#
# So this builds RELEASE, which embeds the Hermes bytecode in the APK. It installs
# and runs standalone, no laptop involved. The Expo template signs release with the
# debug keystore (app/build.gradle:115), so no key management is needed yet — that
# changes before anything reaches a store, but it is correct for a pilot build.
#
# It also publishes each build to a GitHub Release. A workflow artifact is a zip
# behind a sign-in wall, which is wrong for putting an app on a phone and very
# wrong for sixty pilot participants in October. A release asset is a plain URL
# that a phone installs from in one tap.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # required to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # ------------------------------------------------------------------ SDK
      # setup-android installs the command-line tools, a platform and build-tools,
      # but not the NDK — and Expo SDK 57 pins ndkVersion 27.1.12297006.
      - name: Install the NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1" \
            > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Record the toolchain
        run: |
          {
            echo '## Toolchain'
            echo '```'
            java -version 2>&1
            echo "node   $(node -v)"
            ls "$ANDROID_SDK_ROOT/ndk" 2>&1 || echo 'no ndk directory'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------- JavaScript side
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Engine tests
        working-directory: packages/engine
        run: node --experimental-strip-types --no-warnings --test test/*.test.ts

      - name: Adaptive engine simulation
        working-directory: packages/engine
        run: node --experimental-strip-types --no-warnings sim/harness.ts

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # -------------------------------------------------------------- the APK
      - name: Build APK
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"

      # The APK is worthless if the JS never made it in. Fail loudly here rather
      # than discovering it on the phone.
      - name: Verify the bundle is inside the APK
        working-directory: .
        run: |
          set -euo pipefail
          APK=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK  ($(du -h "$APK" | cut -f1))"
          if unzip -l "$APK" | grep -qE "assets/index.android.bundle"; then
            echo "JS bundle present — this APK runs standalone."
          else
            echo "::error::APK contains no JS bundle; it would fail to start on a device."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Report what Gradle said
        if: always()
        working-directory: .
        run: |
          if [ ! -f gradle.log ]; then
            echo 'Gradle produced no log — it did not start.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Gradle — last 200 lines'
            echo '```'
            tail -n 200 gradle.log
            echo '```'
            echo '## Every line containing an error'
            echo '```'
            grep -nE "FAILURE|error:|ERROR|Caused by|What went wrong|Could not|Cannot|not found|No version" gradle.log | tail -n 80 || echo 'none'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore

      - name: Upload the APK as an artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mettle-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

      # ------------------------------------------------------- one-tap install
      - name: Publish the APK as a release
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="mettle-v0.1-build${{ github.run_number }}.apk"
          cp "$APK_PATH" "$OUT"
          gh release create "build-${{ github.run_number }}" "$OUT" \
            --title "Mettle v0.1 — build ${{ github.run_number }}" \
            --notes "Android, arm64-v8a. Installs and runs standalone. Commit ${{ github.sha }}." \
            --latest
          URL="https://github.com/${{ github.repository }}/releases/latest"
          echo "## Install it" >> "$GITHUB_STEP_SUMMARY"
          echo "Open **$URL** on the phone and tap **$OUT**." >> "$GITHUB_STEP_SUMMARY"
